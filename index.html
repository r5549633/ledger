<style>

*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px "Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;overflow:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}

.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}

.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:rgba(255,255,255,.25)}.bar i{display:block}
.leg{display:flex;justify-content:space-between;font-size:12px;margin-top:8px;flex-wrap:wrap;gap:4px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.pair .card{margin:0}.pair b{font-size:19px}

.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.row:first-child{border:0}
.row small,.hold small{display:block;color:var(--sub);font-size:12px}.l{display:flex;align-items:center;gap:10px}.dot{width:10px;height:10px;border-radius:50%}

.f{display:flex;gap:8px;margin-bottom:10px}.f>*{flex:1;min-width:0}
input,select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:11px;font:inherit;width:100%}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pad button{background:var(--card);border:0;color:var(--ink);font:inherit;font-size:22px;padding:12px 0;border-radius:14px}.pad button:active{background:var(--soft)}
.go{width:100%;border:0;background:var(--acc);color:#fff;font:inherit;font-weight:700;font-size:16px;padding:14px;border-radius:14px}
@media(prefers-color-scheme:dark){.go{color:#10141c}}.go:disabled{opacity:.5}
details{margin-bottom:12px}summary{color:var(--sub);font-size:13px;margin-bottom:8px}
.prog{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin:8px 0}.prog i{display:block;height:100%;background:var(--acc)}
.hold{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}.hold .g{margin-left:auto}.n{display:inline-block;min-width:7ch;text-align:right;font-variant-numeric:tabular-nums}.hold:first-child{border:0}.r{text-align:right}
nav{display:flex;background:var(--card);border-top:1px solid var(--line)}
nav button{flex:1;border:0;background:none;color:var(--sub);font:inherit;font-size:12px;padding:10px 0 12px}nav b{display:block;font-size:20px;font-weight:400}nav .on{color:var(--acc);font-weight:700}
.toast{z-index:20;position:absolute;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;max-width:92%;text-align:center}.toast.show{opacity:1}
#setup{position:absolute;inset:0;background:var(--bg);z-index:9;padding:24px 16px;display:none;overflow:auto}#setup.on{display:block}
.empty{color:var(--sub);text-align:center;padding:14px 0;font-size:13px}
.hero.plain{background:var(--card);color:var(--ink)}.hero.plain small{opacity:1;color:var(--sub)}
:root{--tr:#7c4dcc}@media(prefers-color-scheme:dark){:root{--tr:#b388ff}}
#kind [data-k="收入"],#mk [data-k="贏"]{color:var(--up)}
#kind [data-k="支出"],#mk [data-k="輸"]{color:var(--down)}
#kind [data-k="轉帳"]{color:var(--tr)}
#kind .on,#mk .on{color:#fff}
@media(prefers-color-scheme:dark){#kind .on,#mk .on{color:#10141c}}
#kind .on[data-k="收入"],#mk .on[data-k="贏"]{background:var(--up)}
#kind .on[data-k="支出"],#mk .on[data-k="輸"]{background:var(--down)}
#kind .on[data-k="轉帳"]{background:var(--tr)}
.hold small.up,.row small.up{color:var(--up)}.hold small.down,.row small.down{color:var(--down)}
.lb{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
.tp1{color:#0288d1!important;font-weight:700}.tp2{color:var(--up)!important;font-weight:700}.tp3{color:var(--down)!important;font-weight:700}.tp4{color:var(--tr)!important;font-weight:700}
@media(prefers-color-scheme:dark){.tp1{color:#40c4ff!important}}
#sTot{font-weight:700}
.big .pc{font-size:18px;font-weight:500;margin-left:6px}.sub{font-size:12px;font-weight:700;color:var(--sub);margin:12px 0 2px}.sub:first-child{margin-top:0}
.top>span{display:flex;align-items:center;gap:6px;white-space:nowrap}.ico{padding:6px 9px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.hd h2{margin:0}
.recbody{display:none}.recbody.on{display:block}
#asheet{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:8;display:none;align-items:flex-end}#asheet.on{display:flex}
#asheet .pn{background:var(--card);width:100%;max-height:75%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}#asheet .hd b{font-size:17px}
@supports (appearance:base-select){select,::picker(select){appearance:base-select}::picker(select){border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.18)}select option{padding:8px 10px;border-radius:8px}select option:checked{background:var(--soft)}}
.fl{display:flex;justify-content:space-between;align-items:flex-end}.fl small{display:block;color:var(--sub);font-size:12px}
#splash{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:linear-gradient(155deg,#2ee6c4 0%,#0a7cc0 32%,#0a3ab4 66%,#5b3fe8 100%);color:#fff;transition:opacity .45s}
#splash img{width:min(42vw,200px);border-radius:22%;box-shadow:0 14px 44px rgba(0,0,0,.35)}#splash b{font-size:22px;letter-spacing:3px}
.hch{display:flex;align-items:center;gap:16px;cursor:pointer}.donut{flex:0 0 112px;height:112px;border-radius:50%;position:relative}.donut::after{content:"";position:absolute;inset:27px;background:var(--card);border-radius:50%}.hlg{flex:1;min-width:0}.hlg .row{padding:7px 0;border:0;font-size:14px}
.mon .nv{display:flex;align-items:center;gap:6px}.mon .nv span{font-size:13px;min-width:5.5em;text-align:center}.mon .nv .ico:disabled{opacity:.35}
.m3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 8px;text-align:center}.m3 small{display:block;color:var(--sub);font-size:12px;margin-bottom:2px}.m3 b{font-size:16px}
.pend{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--cash);border-radius:8px;padding:1px 6px;margin-left:6px}
.ebar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--soft);border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:13px}
.more{width:100%;margin-top:10px;padding:9px}.clk{cursor:pointer}.clk:active{opacity:.6}
#cdlg{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:15;display:none;align-items:center;justify-content:center;padding:24px}#cdlg.on{display:flex}
.cb{background:var(--card);border-radius:22px;padding:24px 20px 18px;width:100%;max-width:330px;text-align:center;box-shadow:0 16px 48px rgba(0,0,0,.3)}
.cb .ct{font-size:18px;font-weight:700;margin-bottom:8px}.cb p{color:var(--sub);font-size:14px;line-height:1.7;margin-bottom:18px}
.cbt{display:flex;gap:10px}.cbt button{flex:1;border:0;border-radius:14px;padding:13px;font:inherit;font-weight:700;font-size:15px}.cbt .no{background:var(--soft);color:var(--ink)}.cbt .yes{background:var(--up);color:#fff}
.srch{display:flex;gap:8px;margin:2px 0 10px}.srch input{flex:1;min-width:0}
.pnl,.lp{display:none}.pnl.on,.lp.on{display:block}
.ctx{background:var(--soft);border-radius:12px;padding:9px 12px;font-size:13px;margin-bottom:12px;min-height:38px;display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;line-height:1.5}.ctx small{color:var(--sub);font-size:12px}.ctx .warn{color:var(--up);font-weight:700}
.dr{display:flex;align-items:center;gap:8px;margin-bottom:10px}.dr input{flex:0 0 140px}.dr .amt{flex:1;min-width:0;margin:0;font-size:34px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dr .amt span{font-size:14px}
.seg.mini{margin-top:-6px}.seg.mini button{padding:6px;font-size:13px}
#mode button{font-weight:700}
#sk [data-k="買進"]{color:var(--up)}#sk [data-k="賣出"]{color:var(--down)}#sk [data-k="定期定額"]{color:#0288d1}
#sk .on{color:#fff!important}#sk .on[data-k="買進"]{background:var(--up)}#sk .on[data-k="賣出"]{background:var(--down)}#sk .on[data-k="定期定額"]{background:#0288d1}
@media(prefers-color-scheme:dark){#sk .on{color:#10141c!important}}
#sFee{font-size:12px;color:var(--sub);text-align:right;margin:-6px 0 10px;min-height:16px;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.tile{border:2px solid var(--line);border-radius:14px;padding:8px 12px;background:var(--card);cursor:pointer}
.tile.on{border-color:var(--acc)}.tile small{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:12px;min-height:16px}.tile b{display:block;font-size:24px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.unit{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:8px;font:inherit;font-size:12px;padding:1px 8px}
.go{transition:background .2s,transform .15s}.go.ok{background:#00b85c!important;color:#fff!important;transform:scale(.98)}
.lastb{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;padding:9px 12px;border-radius:12px;background:var(--soft);font-size:13px;animation:pop .35s}.lastb span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ic{flex:0 0 30px;width:30px;height:30px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:16px}
.nm{font-size:12px;color:var(--sub);font-weight:400}.hint{font-size:12px;color:var(--sub);text-align:center;margin:4px 0 12px}
.ald{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.22)}.ald small{display:block;opacity:.75;font-size:12px}.ald b{font-size:17px;font-variant-numeric:tabular-nums}
@media(prefers-color-scheme:dark){.ald{border-top-color:rgba(0,0,0,.18)}}
.ag{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:4px;margin-top:14px}.ag:first-child{margin-top:4px}.ag+.row{border-top:0}
.ubar{width:140px;max-width:40vw;height:5px;border-radius:3px;background:var(--soft);margin-top:5px;overflow:hidden}.ubar i{display:block;height:100%}
#mjC .r small{display:block;color:var(--sub);font-size:12px;margin-top:2px}.mon .m3{margin-top:6px}
.dots{display:inline-flex;gap:3px;vertical-align:middle}.dots i{width:9px;height:9px;border-radius:50%}.dots .w{background:var(--up)}.dots .l{background:var(--down)}
.dr .seg.mini{flex:0 0 auto;margin:0;padding:3px}.dr .seg.mini button{flex:0 0 auto;padding:7px 11px;font-size:14px}
.amt.sa{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}.amt.sa small{font-size:12px;font-weight:500;color:var(--sub)}.amt.sa b{font-size:30px;white-space:nowrap}.dr input{flex-basis:132px!important}

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const DEFAULT_URL="https://script.google.com/macros/s/AKfycbyhtxCeNPC1euNGPN64xW1bHeMCZ1IyFrZhXgOLp2omFF7VBHaU5Q9jCloCz5nhDGTXYg/exec";
const st={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let cfg={url:st.get('url')||DEFAULT_URL,token:st.get('token')||''},D=null,R=null,kind='支出',cat='',amt='',busy=false,mres='贏',ih=true;

let hid=true;const H=t=>hid?'******':t,IH=t=>ih?'******':t;const fmt=n=>(n<0?'-':'')+'NT$'+Math.abs(Math.round(n)).toLocaleString(),S=(o,k)=>(o&&o[k])||{value:0,text:'-'},sg=n=>(n>=0?'+':'')+Math.round(n).toLocaleString();

/* ===== 最近記錄「更多」：每按一次多顯示 5 筆，本機已經有的直接顯示，不夠才向後端再抓一批（20 列） ===== */
const mkX=b=>({base:b,e:{rows:[],show:5,more:b&&b.expenses?b.expenses.length>=20:true,before:null,busy:false},m:{rows:[],show:5,more:b&&b.mahjong?b.mahjong.length>=15:true,before:null,busy:false},s:{rows:[],show:5,more:b&&b.stocks?b.stocks.length>=5:true,before:null,busy:false}});

const fullOf=k=>k==='e'?fullE():rawX(k),shownE=()=>fullE().slice(0,XE.e.show),shownM=()=>rawX('m').slice(0,XE.m.show),shownS=()=>rawX('s').slice(0,XE.s.show);

  return`<button class="ico more" data-more="${k}"${x.busy?' disabled':''}>${x.busy?'載入中…':'更多'}</button>`}

async function doSearch(k){
  const q=$('#q'+k).value.trim();
  if(!q){if(SR[k]){SR[k]=null;render()}return}

  catch(e){toast(String(e.message).includes('未知的動作')?'請先更新後端程式並重新部署':'失敗：'+e.message,3500)}

async function moreList(k){
  const x=XE[k];if(x.busy)return;x.show+=5;

    x.busy=true;render();
    try{for(let i=0;i<5&&fullOf(k).length<x.show&&x.more;i++){
      const b=nextBefore(k);if(b==null){x.more=false;break}
      const d=await api('moreRecent',{kind:kd,before:b,n:20});
      if(XE[k]!==x)return;

    catch(e){x.show-=5;toast(String(e.message).includes('未知的動作')?'請先更新後端程式並重新部署':'失敗：'+e.message,3500)}
    finally{x.busy=false}}
  render()}

const money=n=>Number(n).toLocaleString(),TPC={定期定額:'tp1',現股買入:'tp2',現股沖買:'tp2',現股賣出:'tp3',現股沖賣:'tp3',股票申購:'tp4'};

    `<div class="sub">共 ${d.count} 筆 · 合計 ${fmt(d.total)}</div>`+(d.records.map(r=>`<div class="row"><div class="l"><span class="ic">${icon(r.category)}</span><div>${r.category}<small>${r.date} · ${r.account}${r.note?' · '+r.note:''}</small></div></div><b class="${cl}">${sn}${money(r.amount)}</b></div>`).join('')||'<div class="empty">沒有記錄</div>')+(d.count>d.records.length?'<div class="empty">只顯示最新 '+d.records.length+' 筆</div>':''))}

$('#monC').addEventListener('click',e=>{
  const a=e.target.closest('[data-md]');if(a){openMonth(a.dataset.md,null,a.dataset.md==='income'?'收入':'支出');return}

async function apiOnce(action,payload,ms,id){
  const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),ms);let txt;
  try{
    const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:cfg.token,action,payload:payload||{},id}),signal:ac.signal});
    txt=await r.text();
  }catch(e){const er=UE(e.name==='AbortError'?'等太久沒有回應（逾時）':'連線失敗，請檢查網路');if(e.name==='AbortError')er.noRetry=true;throw er}
  finally{clearTimeout(tm)}
  let j;
  try{j=JSON.parse(txt)}catch(e){
    const t=(txt.match(/<title>([^<]*)<\/title>/i)||[])[1]||'';
    throw UE('伺服器回傳了網頁而不是資料'+(t?'（'+t.trim()+'）':''))}
  if(!j.ok){const er=new Error(j.error||'失敗');er.fatal=true;er.auth=j.code===401;if(j.code===401)openSetup('密碼不正確，請重新輸入');throw er}
  return j.data}
// 讀取可以安全重試；寫入不會在這裡自動重試（離線暫存的補送靠 id，後端會擋掉重複）
async function api(action,payload,id){
  const read=READS.includes(action);
  for(let n=0;;n++){
    try{return await apiOnce(action,payload,read?40000:action==='fetchNames'?70000:60000,id)}
    catch(e){if(!read||e.fatal||e.noRetry||n>=2)throw e;await new Promise(r=>setTimeout(r,1500*(n+1)))}}}
let lastSync=0,loading=false;
const hhmm=t=>new Date(t).toTimeString().slice(0,5);
function saveCache(){lastSync=Date.now();st.set('cache',JSON.stringify({D,R,t:lastSync}))}
function loadCache(){try{const c=JSON.parse(st.get('cache')||'null');if(c&&c.D){D=c.D;R=c.R;lastSync=c.t;return true}}catch(e){}return false}
async function fetchAll(){
  try{const a=await api('all');return[a.dashboard,a.recent]}
  catch(e){if(String(e.message).includes('未知的動作'))return Promise.all([api('dashboard'),api('recent')]);throw e}}
let namesBusy=false;
async function ensureNames(){
  if(namesBusy||!D)return;
  const need=[...new Set(D.holdings.filter(h=>!h.name).map(h=>h.code.replace('定期定額','').trim()))].filter(Boolean);
  if(!need.length||Date.now()-(+st.get('namesTry')||0)<6*36e5)return;
  namesBusy=true;st.set('namesTry',String(Date.now()));
  try{const nm=await api('fetchNames',{codes:need});D.holdings.forEach(h=>{const b=h.code.replace('定期定額','').trim();if(nm[b])h.name=nm[b]});saveCache();render()}catch(e){}finally{namesBusy=false}}
async function load(force){
  if(!cfg.token){openSetup('');return}
  if(loading){if(!force)return;while(loading)await new Promise(r=>setTimeout(r,200))}loading=true;
  $('#sync').textContent=D?'更新中…':'讀取中…';
  try{if(Q.length)await flushQ();[D,R]=await fetchAll();saveCache();$('#sync').textContent='已同步 '+hhmm(lastSync)}
  catch(e){$('#sync').textContent=D?'離線 · '+hhmm(lastSync):'未連線';toast(e.message==='Failed to fetch'?'連線失敗，顯示上次資料':e.message,3000)}
  finally{loading=false}
  render();ensureNames();loadMonthly()}
setTimeout(()=>hideSplash(),5000);
function hideSplash(){const e=$('#splash');if(!e||e.dataset.h)return;e.dataset.h=1;setTimeout(()=>{e.style.opacity=0;setTimeout(()=>e.remove(),450)},Math.max(0,1200-performance.now()))}
function mergeRec(a){const o=[],TC=CATS.轉帳;for(let i=0;i<a.length;i++){const x=a[i],y=a[i+1];
  if(x.type==='轉帳'){o.push({...x,transfer:true,from:x.account,to:x.toAccount||'',fee:x.fee||0,o:[x]});continue}
  if(y&&TC.includes(x.category)&&x.type==='收入'&&y.type==='支出'&&y.category===x.category&&y.date===x.date&&y.amount===x.amount&&(x.row==null||x.row===y.row+1)){o.push({...x,transfer:true,from:y.account,to:x.account,fee:y.fee||0,o:[y,x]});i++}else o.push(x)}return o}
function trRow(r,i){return`<div class="row" data-e="${i}" style="cursor:pointer">${rowL(icon(r.category),r.category,`${r.date} · ${r.from} ➜ ${r.to}${r.fee>0?' · 手續費 '+r.fee.toLocaleString():''}${r.note?' · '+esc(r.note):''}`)}<b style="color:var(--tr)">${r.amount.toLocaleString()}</b></div>`}
function stockRecent(){
  if(R&&Array.isArray(R.stocks))return R.stocks;
  try{return JSON.parse(st.get('stk')||'[]')}catch(e){return[]}}
function render(){hideSplash();
  if(!D)return;const sm=D.summary,s=D.stats,tot=S(sm,'總資產').value,sk=S(sm,'股票資產').value,ca=S(sm,'現金資產').value;
  const bankSum=D.accounts.filter(a=>a.type==='bank').reduce((p,a)=>p+a.balance,0),cardSum=D.accounts.filter(a=>a.type==='card').reduce((p,a)=>p+a.balance,0);
  $('#total').textContent=H(fmt(tot));$('#hA').textContent=H(fmt(bankSum));$('#hL').textContent=H(fmt(cardSum));$('#bS').style.width=hid?'100%':tot>0?Math.max(sk,0)/tot*100+'%':0;$('#bC').style.width=hid?'0':tot>0?Math.max(ca,0)/tot*100+'%':0;$('#bS').style.background=hid?'rgba(255,255,255,.5)':'#fff';
  $('#lS').textContent='股票 '+H(fmt(sk));$('#lC').textContent='現金 '+H(fmt(ca));
  const mj=S(sm,'麻將記帳').value,fam=S(sm,'家庭開銷').value;
  $('#fam').textContent=H((fam<0?'-':'')+Math.abs(Math.round(fam)).toLocaleString());$('#fam').className=!hid&&fam<0?'neg':'';
  $('#mjB').textContent=hid?'******':sg(mj);$('#mjB').className=hid?'':mj>=0?'up':'down';

  const aRow=a=>{const u=a.type==='card'&&a.limit>0?Math.min(100,Math.max(0,-a.balance)/a.limit*100):-1;return`<div class="row" data-a="${a.name}" style="cursor:pointer"><div class="l"><i class="dot" style="background:${col[a.type]}"></i><div>${a.name}<small>${u>=0?(hid?'已用額度 ******':`已用 ${u.toFixed(0)}% · 剩餘 ${fmt(a.limit+a.balance)}`):lab[a.type]}</small>${u>=0?`<div class="ubar"><i style="width:${hid?0:u}%;background:${u>=80?'var(--up)':col.card}"></i></div>`:''}</div></div><b class="${!hid&&a.balance<0?'neg':''}">${H(fmt(a.balance))}</b></div>`};
  $('#accs').innerHTML=[['bank','銀行'],['sec','證券'],['card','信用卡']].map(([t,n])=>{const g=D.accounts.filter(a=>a.type===t);if(!g.length)return'';const sum=g.reduce((p,a)=>p+a.balance,0);return`<div class="sub ag"><span>${n}</span><span>${H(fmt(sum))}</span></div>`+g.map(aRow).join('')}).join('');
  const ug=S(s,'未實現總損益').value,rv=S(s,'已實現總損益').value,cl=n=>n>=0?'up':'down';
  $('#ug').innerHTML=ih?'******':sg(ug)+'<span class="pc">（'+S(s,'未實現總損益%').text+'）</span>';$('#ug').className='big '+(ih?'':cl(ug));
  $('#rg').innerHTML='已實現損益 '+(ih?'******':`<span class="${cl(rv)}">${sg(rv)}（${S(s,'已實現總損益%').text}）</span>`);$('#rg').className='';
  $('#sc').textContent=IH(S(s,'股票總成本').value.toLocaleString());$('#sv').textContent=IH(S(s,'股票總現值').value.toLocaleString());$('#sv').className='';
  const hr=h=>{const c=h.gain>=0?'up':'down';return`<div class="hold" data-h="${h.code}" style="cursor:pointer"><div>${h.code.replace('定期定額','').trim()}<small>${h.qty} 股</small></div><div class="r g ${c}" style="font-size:14px;font-weight:700">${sg(h.gain)}(${h.gainPct})</div><div class="r" style="font-size:14px;line-height:1.5"><div><span style="color:var(--sub)">成本</span> <span class="n">${h.cost.toLocaleString()}</span></div><div><span style="color:var(--sub)">現值</span> <span class="n">${h.value.toLocaleString()}</span></div></div></div>`},sec=(t,a)=>a.length?`<div class="sub">${t}</div>`+a.map(hr).join(''):'';
  $('#holds').innerHTML=ih?'<div class="hold"><b>******</b></div>':sec('定期定額',D.holdings.filter(h=>h.code.includes('定期定額')))+sec('現股',D.holdings.filter(h=>!h.code.includes('定期定額')))||'<div class="empty">沒有持股</div>';
  const nm={};D.holdings.forEach(h=>{if(h.name)nm[h.code.replace('定期定額','').trim()]=h.name});const nameOf=c=>nm[c]||'';

async function openAcct(name){
  if(hid)return toast('請先按「顯示」');
  $('#at').textContent=name;$('#al').innerHTML='<div class="empty">載入中…</div>';$('#asheet').classList.add('on');

  catch(e){$('#asheet').classList.remove('on');toast('失敗：'+e.message,3500)}}

/* ===== 修改最近記錄：點一筆 → 帶入表單 → 儲存修改（後端會先比對 Sheet 內容，對不上就不動） ===== */
const isoOf=r=>r.iso||((r.date||'').match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/)||[]).slice(1).map((x,i)=>i?x.padStart(2,'0'):x).join('-')||today;
function startEdit(r){
  if(r.row==null)return toast('請先把後端程式更新到新版，才能使用修改',3500);
  ed=null;setKind(r.transfer?'轉帳':r.type);
  ed={orig:(r.o||[r]).map(o=>({row:o.row,date:o.date,type:o.type,category:o.category,account:o.account,amount:o.amount,note:o.note||''}))};
  cat=r.category;amt=String(r.amount);$('#av').textContent=Number(amt).toLocaleString();drawCats();
  $('#date').value=isoOf(r);$('#acc').value=r.transfer?r.from:r.account;$('#acc2').value=r.transfer?r.to:'';colorSel($('#acc'));colorSel($('#acc2'));
  $('#note').value=r.note||'';$('#proj').value=r.project||'';$('#fee').value=r.fee>0?r.fee:'';$('#cur').value='';$('#fa').value='';
  $('#proj').closest('details').open=!!(r.project||r.fee>0);
  $('#eb').style.display='flex';updGo();updNum();
  goTab('rec');setMode('e')}
function startEditMj(m){
  if(m.row==null)return toast('請先把後端程式更新到新版，才能使用修改',3500);
  edm={orig:{row:m.row,date:m.date,result:m.result,amount:m.amount}};
  mres=m.result;$$('#mk button').forEach(b=>b.classList.toggle('on',b.dataset.k===mres));
  $('#mD').value=isoOf(m);ma=String(m.amount);$('#mEb').style.display='flex';updGo();updNum();goTab('rec');setMode('m')}
function endEditMj(){edm=null;$('#mEb').style.display='none';ma='';$('#mD').value=today;updGo();updNum()}
const backList=k=>{setLM(k);goTab('list')};$('#eCx').onclick=()=>{const w=!!ed;clearAdd();if(w)backList('e')};$('#mCx').onclick=()=>{const w=!!edm;endEditMj();if(w)backList('m')};

document.addEventListener('click',e=>{
  const mb=e.target.closest('[data-more]');if(mb){moreList(mb.dataset.more);return}
  const q=e.target.closest('[data-q]');if(q){const qid=q.dataset.q;ask('⏳ 這筆還在等補送','它還存在手機裡、沒有送出去。要把它丟掉嗎？','丟掉','留著').then(ok=>{if(ok){Q=Q.filter(x=>x.id!==qid);saveQ();render()}});return}
  const x=e.target.closest('[data-e]');if(x&&EL[+x.dataset.e]){startEdit(EL[+x.dataset.e]);return}
  const y=e.target.closest('[data-m]');if(y&&ML[+y.dataset.m])startEditMj(ML[+y.dataset.m])});
/* ===== 月報表（後端算好，這裡只顯示；轉帳的存款、繳卡費不算，投資算支出） ===== */
const shiftMonth=(m,n)=>{let y=+m.slice(0,4),k=+m.slice(5)-1+n;y+=Math.floor(k/12);k=((k%12)+12)%12;return y+'-'+String(k+1).padStart(2,'0')};
async function loadMonthly(){
  if(!cfg.token)return;const m=mon;
  try{const d=await api('monthly',{month:m});MD[m]=d;st.set('mon',JSON.stringify(MD))}
  catch(e){if(String(e.message).includes('未知的動作')&&!monWarned){monWarned=true;toast('月報表需要先更新後端程式',3500)}}
  if(m===mon)renderMonthly()}
function renderMonthly(){
  const d=MD[mon];$('#mLb').textContent=mon.slice(0,4)+'年'+(+mon.slice(5))+'月';$('#mN').disabled=mon>=today.slice(0,7);$('#mP').disabled=!!minMon&&mon<=minMon;
  if(!d){['mI','mE','mB'].forEach(i=>{$('#'+i).textContent='-';$('#'+i).className=''});$('#mC').innerHTML='';return}
  $('#mI').textContent=H(fmt(d.income));$('#mE').textContent=H(fmt(d.expense));$('#mB').textContent=H(fmt(d.balance));
  $('#mI').className=hid?'':'up';$('#mE').className=hid?'':'down';$('#mB').className=!hid&&d.balance<0?'neg':'';
  const cs=d.cats.slice(0,6),rest=d.cats.slice(6).reduce((a,c)=>a+c.value,0);if(rest>0)cs.push({name:'其餘分類',value:rest});
  const tot=cs.reduce((a,c)=>a+c.value,0),pal=['#4285f4','#ea4335','#fbbc04','#34a853','#b388ff','#ff8a65','#8c97a9'];let ac=0;
  const stops=cs.map((c,i)=>{const f=ac/tot*100;ac+=c.value;return`${pal[i]} ${f}% ${ac/tot*100}%`}).join(',');
  MCS=hid?[]:cs.map(c=>({name:c.name,names:c.name==='其餘分類'?d.cats.slice(6).map(z=>z.name):[c.name]}));
  $('#mC').innerHTML=hid?'':!cs.length?'<div class="empty">這個月還沒有支出</div>':`<div class="hch" style="cursor:default"><div class="donut" style="background:conic-gradient(${stops})"></div><div class="hlg">${cs.map((c,i)=>`<div class="row" data-mc="${i}" style="cursor:pointer"><div class="l"><i class="dot" style="background:${pal[i]}"></i><div>${icon(c.name)} ${c.name}<small>${fmt(c.value)}</small></div></div><b>${(c.value/tot*100).toFixed(1)}%</b></div>`).join('')}</div></div>`}
let minMon=st.get('minMon')||'';
$('#mP').onclick=async function(){if(this.disabled)return;const pm=shiftMonth(mon,-1);let d=MD[pm];
  if(!d||!d.count){this.disabled=true;try{d=await api('monthly',{month:pm});MD[pm]=d;st.set('mon',JSON.stringify(MD))}catch(e){renderMonthly();return toast('失敗：'+e.message,3000)}}
  if(!d.count){minMon=mon;st.set('minMon',mon);renderMonthly();return toast('沒有更早的記錄了')}
  mon=pm;renderMonthly();loadMonthly()};
$('#mN').onclick=()=>{if(mon>=today.slice(0,7))return;mon=shiftMonth(mon,1);renderMonthly();loadMonthly()};
window.addEventListener('online',()=>{if(cfg.token)load(true)});
setInterval(()=>{if(Q.length&&!document.hidden)flushQ()},60000);
['date','sD','mD'].forEach(i=>$('#'+i).value=today);drawCats();drawPad();updGo();updNum();if(loadCache()){render();$('#sync').textContent='上次同步 '+hhmm(lastSync)}load();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cfg.token&&(Date.now()-lastSync>60000||Q.length))load()});
