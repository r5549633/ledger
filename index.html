<script>

async function moreList(k){

  if(fullOf(k).length<x.show&&x.more){
    x.busy=true;render();
    try{for(let i=0;i<5&&fullOf(k).length<x.show&&x.more;i++){
      const b=nextBefore(k);if(b==null){x.more=false;break}
      const d=await api('moreRecent',{kind:kd,before:b,n:20});
      if(XE[k]!==x)return;
      x.rows=x.rows.concat(d.records);x.before=d.next;x.more=!!d.more}}
    catch(e){x.show-=5;toast(String(e.message).includes('未知的動作')?'請先更新後端程式並重新部署':'失敗：'+e.message,3500)}

async function apiOnce(action,payload,ms,id){
  const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),ms);let txt;
  try{
    const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:cfg.token,action,payload:payload||{},id}),signal:ac.signal});
    txt=await r.text();
  }catch(e){const er=UE(e.name==='AbortError'?'等太久沒有回應（逾時）':'連線失敗，請檢查網路');if(e.name==='AbortError')er.noRetry=true;throw er}
  finally{clearTimeout(tm)}
  let j;
  try{j=JSON.parse(txt)}catch(e){
    const t=(txt.match(/<title>([^<]*)<\/title>/i)||[])[1]||'';
    throw UE('伺服器回傳了網頁而不是資料'+(t?'（'+t.trim()+'）':''))}
  if(!j.ok){const er=new Error(j.error||'失敗');er.fatal=true;er.auth=j.code===401;if(j.code===401)openSetup('密碼不正確，請重新輸入');throw er}
  return j.data}
// 讀取可以安全重試；寫入不會在這裡自動重試（離線暫存的補送靠 id，後端會擋掉重複）
async function api(action,payload,id){
  const read=READS.includes(action);
  for(let n=0;;n++){
    try{return await apiOnce(action,payload,read?40000:action==='fetchNames'?70000:60000,id)}
    catch(e){if(!read||e.fatal||e.noRetry||n>=2)throw e;await new Promise(r=>setTimeout(r,1500*(n+1)))}}}

function updPend(){const e=$('#pendbar');if(!Q.length){e.style.display='none';return}e.style.display='flex';$('#pendTx').textContent='⏳ '+Q.length+' 筆記錄待同步（連線後自動補送）'}
// 補送暫存的記錄：每筆都帶原本的 id，後端遇到重複的 id 會直接略過，所以重送不會重複記帳
async function flushQ(){
  if(flushing||!Q.length||!cfg.token||navigator.onLine===false)return;flushing=true;let done=0,fresh=null;
  try{while(Q.length){const it=Q[0];
    try{const d=await api(it.action,it.payload,it.id);if(d&&d.fresh)fresh=d.fresh;Q.shift();saveQ();done++}
    catch(e){if(e.fatal&&!e.auth){Q.shift();saveQ();toast('有一筆暫存記錄被伺服器拒絕：'+e.message,6000)}else break}}}
  finally{flushing=false}
  if(fresh){D=fresh.dashboard;R=fresh.recent;saveCache();$('#sync').textContent='已同步 '+hhmm(lastSync)}
  if(done){toast('已補送 '+done+' 筆暫存記錄',3000);loadMonthly()}
  render()}
async function send(btn,action,payload,after){
  if(busy)return;busy=true;btn.disabled=true;const t=btn.textContent;btn.textContent='處理中…';
  const isAdd=ADDS.includes(action),id=isAdd?newId():'';
  try{
    if(isAdd&&navigator.onLine===false)throw UE('離線');
    const d=await api(action,payload,id);after&&after(d);
    if(d&&d.fresh){D=d.fresh.dashboard;R=d.fresh.recent;saveCache();$('#sync').textContent='已同步 '+hhmm(lastSync);render()}else await load(true);
    loadMonthly();if(Q.length)flushQ()
  }catch(e){
    if(isAdd&&e.uncertain){Q.push({id,action,payload,t:Date.now()});saveQ();after&&after(null);render();toast('連不上伺服器，已暫存在手機，連線後會自動補送',4500)}
    else toast(e.uncertain?'沒有收到確認，資料可能已經修改。請先按「同步」確認最近記錄，再決定要不要重送':'失敗：'+e.message,6000)}
  finally{busy=false;btn.disabled=false;btn.textContent=btn.dataset.l||t}}

// 股票：預估總價算法與你原本的表單相同
function calc(){const cm={定期定額:'tp1',現股買入:'tp2',現股沖買:'tp2',現股賣出:'tp3',現股沖賣:'tp3',股票申購:'tp4'},t=$('#sT').value;$('#sT').className=$('#sTot').className=cm[t]||'';const c=$('#sC').value.trim().split(' ')[0],q=+$('#sQ').value,p=+$('#sP').value,o=$('#sTot');
  if(!t||c.length<2||!(q>0)||!(p>0)){o.value='';return}
  const etf=c.startsWith('00'),b=Math.floor(q*p),fee=Math.floor(b*0.001425*0.28);let r;
  if(t==='現股賣出')r=-b+fee+Math.floor(b*(etf?0.001:0.003));else if(t==='現股沖賣')r=-b+fee+Math.floor(b*(etf?0.001:0.0015));
  else if(t==='定期定額')r=b+1;else if(t==='股票申購')r=b;else r=b+fee;o.value=r.toLocaleString()}

$('#sL').oninput=()=>{$('#sQ').value=$('#sL').value?Math.round($('#sL').value*1000):'';calc()};

function renderMonthly(){
  const d=MD[mon];$('#mLb').textContent=mon.slice(0,4)+'年'+(+mon.slice(5))+'月';$('#mN').disabled=mon>=today.slice(0,7);

  $('#mI').className=hid?'':'up';$('#mE').className=hid?'':'down';$('#mB').className=!hid&&d.balance<0?'neg':'';
